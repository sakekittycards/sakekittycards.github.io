name = "sakekitty-vendor"
main = "src/index.js"
compatibility_date = "2025-12-01"

# KV namespace for vendors, magic-link tokens, and sessions.
# Create with:  wrangler kv:namespace create VENDOR_KV
# Then paste the returned id here.
[[kv_namespaces]]
binding = "VENDOR_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"

[vars]
# "From" address on outbound mail. Resend will reject this until the
# sender domain (sakekittycards.com) is verified on the Resend dashboard.
FROM_EMAIL = "Sake Kitty Cards <nick@sakekittycards.com>"
# Public base URL — used to construct magic-link URLs.
SITE_BASE = "https://sakekittycards.com"

# Secrets (set via wrangler secret put — never commit these):
#   RESEND_API_KEY  — from https://resend.com (Settings → API Keys)
#   ADMIN_TOKEN     — random string Nick uses to call /admin/* endpoints
