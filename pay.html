<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Complete your payment · Sake Kitty Cards</title>
<meta name="theme-color" content="#060608">
<link rel="icon" type="image/png" href="logo-icon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#060608;--panel:#121016;--panel2:#1b1824;--border:rgba(255,255,255,.09);
    --text:#fff;--dim:rgba(255,255,255,.6);--muted:rgba(255,255,255,.82);
    --orange:#ff6a00;--pink:#ff0080;--purple:#7b2fff;--cyan:#00d4ff;--good:#33d17a}
  body{background:radial-gradient(1100px 560px at 50% -8%,rgba(123,47,255,.22),transparent 60%),var(--bg);
    color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;line-height:1.5;padding:22px 16px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
  a{color:inherit;text-decoration:none}
  .wrap{width:100%;max-width:460px}
  .brandbar{display:flex;align-items:center;gap:11px;justify-content:center;margin:6px 0 20px}
  .brandbar img{width:46px;height:46px;object-fit:contain;border-radius:11px;filter:drop-shadow(0 4px 14px rgba(255,0,128,.35))}
  .brandbar b{font-family:Bangers,system-ui,cursive;font-weight:400;font-size:26px;letter-spacing:.6px;
    background:linear-gradient(95deg,var(--pink),var(--orange) 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px 18px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--pink),var(--orange) 40%,var(--purple) 70%,var(--cyan))}
  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  h1{font-size:22px;font-weight:800;margin:3px 0 2px;letter-spacing:-.01em}
  .meta{font-size:12.5px;color:var(--dim)}
  .items{margin:16px 0 4px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.05)}
  .row:first-child{border-top:none}
  .row .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .row .p{font-variant-numeric:tabular-nums;flex-shrink:0;font-weight:600}
  .tot{margin-top:14px;font-size:13px;color:var(--dim)}
  .tline{display:flex;justify-content:space-between;padding:3px 0;font-variant-numeric:tabular-nums}
  .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:12px;border-top:1px solid var(--border)}
  .grand span{font-weight:800;font-size:15px}
  .grand b{font-family:Bangers,system-ui,cursive;font-weight:400;font-size:32px;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--pink),var(--orange) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums;padding:2px 2px 6px 0}
  .payhead{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:22px 4px 10px}
  .pay{display:flex;flex-direction:column;gap:10px}
  .pbtn{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:14px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s ease,border-color .15s;position:relative}
  .pbtn:active{transform:scale(.985)}
  .pbtn .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;color:#fff}
  .pbtn .lbl{flex:1;min-width:0}
  .pbtn .lbl small{display:block;font-weight:600;font-size:11.5px;color:var(--dim);margin-top:1px}
  .pbtn .amt{font-variant-numeric:tabular-nums;font-weight:800;flex-shrink:0}
  .pbtn.card{border-color:transparent;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 8px 22px rgba(123,47,255,.4)}
  .pbtn.card .ico{background:rgba(255,255,255,.2)}
  .arrow{opacity:.45;flex-shrink:0}
  .note{font-size:11.5px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.5}
  .socials{display:flex;gap:10px;justify-content:center;margin:26px 0 6px}
  .soc{width:44px;height:44px;border-radius:13px;border:1px solid var(--border);background:var(--panel);display:grid;place-items:center;transition:transform .12s ease,border-color .15s}
  .soc:active{transform:scale(.9)} .soc svg{width:21px;height:21px}
  .foot{text-align:center;font-size:11px;color:var(--dim);margin-top:14px}
  .empty{text-align:center;padding:40px 10px;color:var(--dim)}
  .empty h1{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar"><img id="logo" src="logo-transparent.png" alt=""><b id="store">Sake Kitty Cards</b></div>
  <div id="root"></div>
  <div class="socials">
    <a class="soc" href="https://www.instagram.com/sakekittycards" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="url(#ig)" stroke-width="2"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a00"/><stop offset="1" stop-color="#ff0080"/></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="#ff0080" stroke="none"/></svg></a>
    <a class="soc" href="https://www.youtube.com/@SakeKittyCards" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24" fill="#ff3b3b"><path d="M23 12s0-3.2-.4-4.7a2.5 2.5 0 0 0-1.8-1.8C19.3 5 12 5 12 5s-7.3 0-8.8.5A2.5 2.5 0 0 0 1.4 7.3C1 8.8 1 12 1 12s0 3.2.4 4.7a2.5 2.5 0 0 0 1.8 1.8C4.7 19 12 19 12 19s7.3 0 8.8-.5a2.5 2.5 0 0 0 1.8-1.8C23 15.2 23 12 23 12Z"/><path d="M10 15.5l5-3.5-5-3.5Z" fill="#060608"/></svg></a>
    <a class="soc" href="https://www.sakekittycards.com/whatnot" target="_blank" rel="noopener" aria-label="Whatnot"><svg viewBox="0 0 24 24" fill="none" stroke="#7b2fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/><path d="M7 9.5l2 5 3-6 3 6 2-5"/></svg></a>
  </div>
  <div class="foot">Powered by <b>TCGenie</b> · Secure payment links</div>
</div>
<script>
(function(){
  var root=document.getElementById('root');
  function b64urlDecode(s){ try{ s=String(s||'').replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; return decodeURIComponent(Array.prototype.map.call(atob(s),function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join('')); }catch(e){ return null; } }
  function money(v){ v=Number(v)||0; return '$'+v.toFixed(2); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var d=null;
  try{ var q=new URLSearchParams(location.search).get('d'); if(q){ var j=b64urlDecode(q); if(j)d=JSON.parse(j); } }catch(e){}
  if(!d||!(d.total!=null||(d.items&&d.items.length))){
    root.innerHTML='<div class="empty"><h1>This link needs an invoice</h1><p style="margin-top:8px">Ask your seller to resend the payment link — it carries your order details.</p></div>';
    return;
  }
  if(d.store){ document.getElementById('store').textContent=d.store; document.title='Pay '+d.store; }
  if(d.logo){ var lg=document.getElementById('logo'); lg.onerror=function(){ lg.src='logo-transparent.png'; }; lg.src=d.logo; }
  var items=(d.items||[]);
  var itemsHtml=items.map(function(it){ var q=Number(it.q)||1; var line=(Number(it.p)||0)*q; return '<div class="row"><span class="n">'+(q>1?('<b>'+q+'× </b>'):'')+esc(it.n||'Item')+'</span><span class="p">'+money(line)+'</span></div>'; }).join('');
  var t=d.tax||{}, f=d.fee||{};
  var totalsHtml='';
  if(d.sub!=null) totalsHtml+='<div class="tline"><span>Subtotal</span><span>'+money(d.sub)+'</span></div>';
  if(d.disc>0) totalsHtml+='<div class="tline"><span>Discount '+d.disc+'%</span><span>−'+money((Number(d.sub)||0)*(d.disc/100))+'</span></div>';
  if(t.amt>0) totalsHtml+='<div class="tline"><span>'+(esc(t.st||'')+' tax').trim()+(t.pct?(' ('+t.pct+'%)'):'')+'</span><span>'+money(t.amt)+'</span></div>';
  var pays=(d.pay||[]);
  // brand color per method
  function proc(label){ var l=String(label||'').toLowerCase();
    if(/card|square|stripe|credit|checkout/.test(l)) return {c:'card',bg:'',ic:'💳'};
    if(/venmo/.test(l)) return {bg:'#3d95ce',ic:'V'};
    if(/cash ?app|\$cash/.test(l)) return {bg:'#00d54b',ic:'$'};
    if(/paypal/.test(l)) return {bg:'#0070ba',ic:'P'};
    if(/zelle/.test(l)) return {bg:'#6d1ed4',ic:'Z'};
    if(/apple/.test(l)) return {bg:'#000',ic:''};
    return {bg:'linear-gradient(135deg,#ff6a00,#ff0080)',ic:(String(label||'?').trim()[0]||'•').toUpperCase()};
  }
  var payHtml=pays.map(function(p){ var m=proc(p.label); var isCard=(m.c==='card'); var amt=(p.amt!=null?p.amt:d.total);
    var feeNote=(f.amt>0 && (isCard || p.card))?('<small>includes '+money(f.amt)+' card fee</small>'):(p.note?('<small>'+esc(p.note)+'</small>'):'');
    return '<a class="pbtn'+(isCard?' card':'')+'" href="'+esc(p.url||'#')+'"'+(/^https?:/.test(p.url||'')?' target="_blank" rel="noopener"':'')+'>'
      +'<span class="ico" style="background:'+(m.bg||'')+'">'+m.ico+'</span>'
      +'<span class="lbl">'+esc(p.label||'Pay')+feeNote+'</span>'
      +'<span class="amt">'+money(amt)+'</span>'
      +'<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>';
  }).join('');
  root.innerHTML=
    '<div class="card">'
    +'<div class="eyebrow">Complete your payment</div>'
    +'<h1>'+money(d.total)+' due</h1>'
    +'<div class="meta">'+esc(d.inv||'')+(d.date?('  ·  '+esc(d.date)):'')+(items.length?('  ·  '+items.reduce(function(a,i){return a+(Number(i.q)||1);},0)+' item'+(items.length===1?'':'s')):'')+'</div>'
    +(itemsHtml?('<div class="items">'+itemsHtml+'</div>'):'')
    +(totalsHtml?('<div class="tot">'+totalsHtml+'</div>'):'')
    +'<div class="grand"><span>Total</span><b>'+money(d.total)+'</b></div>'
    +'</div>'
    +(payHtml?('<div class="payhead">Choose how to pay</div><div class="pay">'+payHtml+'</div>'):'<div class="note">No payment methods were attached — reply to your seller to arrange payment.</div>')
    +'<div class="note">Amounts are pre‑filled where the app supports it. Questions about your order? Message us on Instagram.</div>';
})();
</script>
</body>
</html>
